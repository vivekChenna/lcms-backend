services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lcms
      POSTGRES_PASSWORD: lcms
      POSTGRES_DB: lcms_dev
    ports:
      - "5442:5432"
    volumes:
      - lcms_pg_dev:/var/lib/postgresql/data

  # S3-compatible object storage for case documents. This was MinIO until its official images were
  # withdrawn from Docker Hub and Quay; the backend only uses the standard S3 API, so any
  # S3-compatible server works. Same ports and credentials as before (S3 :9000, console :9001).
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: lcms
      RUSTFS_SECRET_KEY: lcms12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lcms_s3_dev:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  lcms_pg_dev:
  lcms_s3_dev:
